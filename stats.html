<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>SkyframeSMP Stats</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Color Palette & Variables */
        :root {
            --primary: #7c3aed;
            --primary-light: #a855f7;
            --bg-dark: #141018;
            --text: #f5f4fb;
            --muted: #bdb9ce;
            --radius: 10px;
        }

        /* Basic Page Setup */
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Hero & Search Styles */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40vh;
        }
        .hero-inner {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .hero-label {
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        h1 {
            font-size: 2.5rem;
            margin: 10px 0 30px;
            background: linear-gradient(135deg, var(--text), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .search-container {
            width: 100%;
        }
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(124, 58, 237, 0.2);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* On-Theme Modal Dialog Styles */
        dialog {
            background-color: rgba(20, 16, 24, 0.95);
            color: var(--text);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(124, 58, 237, 0.15);
            box-sizing: border-box;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.3s ease allow-discrete;
        }

        /* Pop-in animation when opened */
        dialog[open] {
            opacity: 1;
            transform: scale(1);
        }

        @starting-style {
            dialog[open] {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        /* Dark, blurry theme backdrop */
        dialog::backdrop {
            background: rgba(10, 7, 12, 0.75);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease allow-discrete;
        }

        dialog[open]::backdrop {
            opacity: 1;
        }

        @starting-style {
            dialog[open]::backdrop {
                opacity: 0;
            }
        }

        /* Modal Layout Details */
        dialog h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: var(--text);
            border-bottom: 2px solid rgba(124, 58, 237, 0.2);
            padding-bottom: 12px;
        }

        #stats-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            max-height: 250px;
            overflow-y: auto;
        }

        #stats-list li {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: calc(var(--radius) - 4px);
            font-size: 0.95rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            border-left: 3px solid var(--primary);
        }

        /* Action Buttons */
        #close-dialog {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            border-radius: calc(var(--radius) - 2px);
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        #close-dialog:hover {
            opacity: 0.9;
        }

        #close-dialog:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="hero-inner">
            <span class="hero-label">Stats</span>
            <h1>Skyframe Stats</h1>
            
            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Enter a username">
                </div>
            </div>
        </div>
    </div>

    <!-- Theme-accurate Modal Dialog -->
    <dialog id="stats-dialog">
        <div id="dialog-content">
            <h2 id="player-title">Player Stats</h2>
            <ul id="stats-list">
                <!-- Data will be dynamically loaded here -->
            </ul>
            <button id="close-dialog" type="button">Close</button>
        </div>
    </dialog>

    <script>
        const searchInput = document.getElementById('search-input');
        const statsDialog = document.getElementById('stats-dialog');
        const statsList = document.getElementById('stats-list');
        const playerTitle = document.getElementById('player-title');
        const closeButton = document.getElementById('close-dialog');

        closeButton.addEventListener('click', () => statsDialog.close());

        function triggerSearch() {
            const query = searchInput.value.trim();
            if (query) {
                console.log(`User submitted search for: ${query}`);
                lookUp(query);
            }
        }

        searchInput.addEventListener('search', triggerSearch);
        searchInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                triggerSearch();
            }
        });

        async function lookUp(playerName) {
            const url = `https://api.skyframesmp.dev/stats/${encodeURIComponent(playerName)}`;
            const options = {
                method: 'GET',
                headers: { 'content-type': 'application/json' }
            };

            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`API error: ${response.status} ${response.statusText}`);
                
                const data = await response.json();
                console.log('API Data received:', data);
                renderStats(data);
            } catch (error) {
                console.error('Failed to fetch player stats:', error);
            }
        }

        function renderStats(data) {
            playerTitle.textContent = `Stats for ${data.name || 'Unknown'}`;
            statsList.innerHTML = ''; // Clear old stats

            // Added check to verify array status before looping
            if (data.stats && Array.isArray(data.stats)) {
                data.stats.forEach(stat => {
                    const li = document.createElement('li');
                    
                    // Creates a clean key:value display layout
                    li.innerHTML = `<span>${stat.key}</span> <strong>${stat.value}</strong>`;
                    statsList.appendChild(li);
                });
            } else {
                statsList.innerHTML = '<li>No stats available</li>';
            }

            statsDialog.showModal();
        }
    </script>
</body>
</html>
